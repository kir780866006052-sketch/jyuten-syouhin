<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サービス重点商品拡販実績ダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Roboto+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12151a; --panel:#1b2027; --panel-2:#20262f; --line:#2b3340;
  --text:#eceff3; --text-dim:#8a93a3; --red:#c8102e; --amber:#f0a83c;
  --green:#3ec37a; --qty:#5b8def; --mono:'Roboto Mono',ui-monospace,monospace; --sans:'Noto Sans JP',sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
.topbar{border-top:4px solid var(--red);background:linear-gradient(180deg,#171b21,#12151a);padding:20px 28px 16px;
  display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;border-bottom:1px solid var(--line);}
.topbar h1{margin:0;font-size:19px;font-weight:700;}
.topbar .sub{margin-top:4px;color:var(--text-dim);font-size:12.5px;}
.excel-btn{font-family:var(--sans);font-size:12.5px;font-weight:600;background:var(--panel);color:var(--text);
  border:1px solid var(--line);padding:9px 16px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block;}
.excel-btn:hover{border-color:var(--qty);color:var(--qty);}
.half-tabs{display:flex;gap:6px;background:var(--panel);padding:4px;border-radius:8px;border:1px solid var(--line);}
.half-tabs button{font-family:var(--sans);font-size:12.5px;font-weight:700;background:transparent;border:none;color:var(--text-dim);padding:7px 16px;border-radius:6px;cursor:pointer;}
.half-tabs button.active{background:var(--qty);color:#fff;}
.half-tabs button:disabled{opacity:.35;cursor:not-allowed;}
.month-tabs{display:flex;gap:6px;background:var(--panel);padding:4px;border-radius:8px;border:1px solid var(--line);}
.month-tabs button{font-family:var(--mono);font-size:12.5px;font-weight:600;background:transparent;border:none;color:var(--text-dim);padding:7px 12px;border-radius:6px;cursor:pointer;}
.month-tabs button.active{background:var(--red);color:#fff;}
.no-data-msg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:40px 20px;text-align:center;color:var(--text-dim);font-size:13px;margin-bottom:30px;}
main{padding:26px 28px 60px;max-width:1400px;margin:0 auto;}
.gauge-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:30px;}
.gauge-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 12px 14px;
  text-align:center;cursor:pointer;transition:border-color .15s,transform .15s;display:flex;flex-direction:column;align-items:center;}
.gauge-card:hover{border-color:#3a4453;transform:translateY(-2px);}
.gauge-card.selected{border-color:var(--red);background:#211a1c;}
.gauge-card .store-name{font-size:13px;font-weight:600;margin-bottom:8px;}
.gauge-card svg{width:92px;height:92px;}
.gauge-card .achieved-line{margin-top:8px;font-size:11.5px;font-family:var(--mono);font-weight:600;}
.gauge-card .chips{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:20px;}
.gauge-card .chip{font-size:9.5px;background:#243040;color:var(--green);border:1px solid #2f4a3d;padding:2px 7px;border-radius:20px;}
.gauge-card .noTargetList{width:100%;text-align:left;margin-top:6px;}
.gauge-card .noTargetRow{display:flex;justify-content:space-between;gap:6px;font-size:10.5px;padding:3px 4px;border-bottom:1px solid var(--line);}
.gauge-card .noTargetRow:last-child{border-bottom:none;}
.gauge-card .noTargetRow .pname{color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gauge-card .noTargetRow .pqty{color:var(--qty);font-family:var(--mono);font-weight:700;flex:0 0 auto;}
.gauge-card .noTargetEmpty{font-size:11px;color:var(--text-dim);margin-top:10px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px;flex-wrap:wrap;gap:10px;}
.section-head h2{font-size:15px;margin:0;font-weight:700;}
.section-head h2 .store-tag{color:var(--red);}
.section-hint{font-size:15px;color:var(--text);font-weight:400;margin-left:225px;}
.matrix-wrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;margin-bottom:34px;}
.ca-chart{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px 14px;padding:22px 16px 10px;}
.ca-chart-grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));margin-bottom:34px;}
.ca-group{display:flex;flex-direction:column;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 12px 12px;cursor:pointer;transition:border-color .15s;}
.ca-group:hover{border-color:#3a4453;}
.ca-bars{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:150px;width:100%;border-bottom:1px solid var(--line);}
.ca-bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:20px;cursor:pointer;}
.ca-bar-col:hover .ca-bar-track{outline:1px solid var(--qty);}
.ca-bar-col:hover .ca-name{color:var(--text);}
.ca-bar-pct{font-family:var(--mono);font-size:9px;color:var(--text-dim);margin-bottom:3px;}
.ca-bar-track{width:14px;height:130px;background:#2a313d;border-radius:3px 3px 0 0;display:flex;align-items:flex-end;overflow:hidden;}
.ca-bar-fill{width:100%;border-radius:3px 3px 0 0;background:var(--qty);}
.ca-name{font-size:9px;color:var(--text-dim);margin-top:6px;line-height:1.3;text-align:center;height:44px;overflow:visible;}
.ca-group-label{margin-top:8px;font-size:12px;font-weight:700;color:var(--text);text-align:center;max-width:200px;line-height:1.4;}
.ca-group-target{font-size:10px;color:var(--text-dim);font-family:var(--mono);margin-top:2px;}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.store-summary-grid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));margin-bottom:30px;}
.product-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px 12px;cursor:pointer;transition:border-color .15s,transform .15s;}
.product-card:hover{border-color:#3a4453;transform:translateY(-2px);}
.product-card .pname{font-size:12.5px;font-weight:600;margin-bottom:12px;min-height:32px;}
.product-chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding:0 2px;}
.pbar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;}
.pbar-pct{font-family:var(--mono);font-size:9.5px;color:var(--text-dim);margin-bottom:4px;}
.pbar-track{width:100%;max-width:20px;height:110px;background:#2a313d;border-radius:3px 3px 0 0;display:flex;align-items:flex-end;overflow:hidden;}
.pbar-fill{width:100%;border-radius:3px 3px 0 0;}
.pbar-label{font-size:9px;color:var(--text-dim);margin-top:6px;white-space:nowrap;height:12px;}
.pbar-fig{font-size:9px;color:var(--text-dim);font-family:var(--mono);margin-top:2px;white-space:nowrap;height:11px;}
.fill-low{background:var(--red);} .fill-mid{background:var(--amber);} .fill-high{background:var(--green);}
.rank-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);}
.rank-row:last-child{border-bottom:none;}
.rank-badge{font-size:8px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#12151a;flex:0 0 auto;}
.rank-1{background:#e8c34a;} .rank-2{background:#c3c9d1;} .rank-3{background:#c98a4b;}
.rank-plain{width:16px;text-align:center;font-family:var(--mono);font-size:10px;color:var(--text-dim);flex:0 0 auto;}
.rank-row .rname{flex:1;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rank-row .rstore{font-size:10px;color:var(--text-dim);margin-left:4px;font-weight:400;}
.rank-row .rqty{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--qty);}
.rank-list-lg{padding:8px 4px;}
.rank-row-lg{display:flex;align-items:center;gap:14px;padding:16px 6px;border-bottom:1px solid var(--line);}
.rank-row-lg .rname-lg{flex:0 1 auto;}
.rank-row-lg .rqty-lg{margin-left:40px;}
.rank-badge.rank-badge-lg{width:38px;height:38px;font-size:17px;}
.rank-plain.rank-plain-lg{width:38px;font-size:19px;}
.rname.rname-lg{font-size:24px;}
.rstore.rstore-lg{font-size:16px;margin-left:8px;}
.rqty.rqty-lg{font-size:34px;}
footer{text-align:center;color:var(--text-dim);font-size:11px;padding:20px;font-family:var(--mono);}
.modal-overlay{position:fixed;inset:0;background:rgba(8,9,12,.68);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:560px;width:100%;max-height:78vh;overflow:auto;padding:20px 22px 18px;}
.modal-box-lg{max-width:95vw;width:1280px;max-height:92vh;}
.modal-box-lg.modal-list{width:700px;max-width:92vw;}
.modal-box-lg .product-chart-lg{display:flex;align-items:flex-end;gap:24px;height:520px;padding:16px 10px 0;overflow-x:auto;}
.modal-box-lg .pbar-col-lg{flex:1;min-width:80px;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;}
.modal-box-lg .pbar-pct-lg{font-family:var(--mono);font-size:18px;color:var(--text-dim);margin-bottom:8px;font-weight:700;}
.modal-box-lg .pbar-col-lg[onclick]{cursor:pointer;border-radius:8px;transition:background .15s;}
.modal-box-lg .pbar-col-lg[onclick]:hover{background:#20262f;}
.modal-box-lg .pbar-col-lg[onclick]:hover .pbar-track-lg{outline:2px solid var(--qty);}
.modal-box-lg .pbar-col-lg[onclick]:hover .pbar-label-lg{color:var(--text);}
.modal-sub a{text-decoration:underline;cursor:pointer;color:var(--qty);}
.modal-sub a:hover{color:var(--text);}
.modal-box-lg .pbar-track-lg{width:100%;max-width:56px;height:400px;background:#2a313d;border-radius:6px 6px 0 0;display:flex;align-items:flex-end;overflow:hidden;}
.modal-box-lg .pbar-fill{width:100%;border-radius:6px 6px 0 0;}
.modal-box-lg .pbar-label-lg{font-size:14px;color:var(--text-dim);margin-top:14px;text-align:center;line-height:1.4;max-width:130px;}
.modal-box-lg .pbar-fig-lg{font-size:13.5px;color:var(--text-dim);font-family:var(--mono);margin-top:5px;}
.modal-box-lg .modal-head h3{font-size:19px;}
.modal-box-lg .modal-head .modal-sub{font-size:13px;}
.modal-box-detail{max-width:760px;}
.modal-box-detail .modal-head h3{font-size:17px;}
.modal-box-detail .modal-head .modal-sub{font-size:12.5px;}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:4px;}
.modal-head h3{margin:0;font-size:14.5px;font-weight:700;}
.modal-head .modal-sub{font-size:11px;color:var(--text-dim);margin-top:3px;font-family:var(--mono);}
.modal-close{background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:14px;flex:0 0 auto;}
table.detail-table{width:100%;border-collapse:collapse;margin-top:14px;}
table.detail-table th,table.detail-table td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:14px;text-align:left;}
table.detail-table th{color:var(--text-dim);font-weight:600;font-size:12.5px;}
table.detail-table td:nth-child(3),table.detail-table td:nth-child(4){font-family:var(--mono);font-size:13px;color:var(--text-dim);}
@media (max-width:560px){main{padding:20px 14px 40px;}.topbar{padding:16px 16px 14px;}}
</style>
</head>

</div>

const HALF_ORDER = ["上期","下期"];
let currentHalf = ALL_DATA.default_half;
let currentMonth = ALL_DATA[currentHalf].default;
let REPORT = currentMonth ? ALL_DATA[currentHalf].reports[currentMonth] : null;
let currentStoreIndex = 0;

function updateExcelLink(){
  const btn = document.getElementById('excelBtn');
  if(!currentMonth){ btn.style.visibility='hidden'; return; }
  btn.style.visibility='visible';
  const fname = `重点商品CA別進捗_${ALL_DATA[currentHalf].labels[currentMonth]}.xlsx`;
  btn.href = fname;
  btn.setAttribute('download', fname);
}

function renderHalfTabs(){
  const el = document.getElementById('halfTabs');
  el.innerHTML = HALF_ORDER.map(h => {
    const has = ALL_DATA[h] && ALL_DATA[h].months.length>0;
    const cls = (h===currentHalf?'active':'');
    return `<button class="${cls}" ${has?`onclick="switchHalf('${h}')"`:'disabled'}>${h}</button>`;
  }).join('');
}

function switchHalf(h){
  if(!ALL_DATA[h] || !ALL_DATA[h].months.length) return;
  currentHalf = h;
  currentMonth = ALL_DATA[h].default;
  REPORT = ALL_DATA[h].reports[currentMonth];
  currentStoreIndex = 0;
  renderHalfTabs();
  renderMonthTabs();
  renderAll();
}

function renderMonthTabs(){
  const el = document.getElementById('monthTabs');
  const half = ALL_DATA[currentHalf];
  el.innerHTML = half.months.map(m =>
    `<button class="${m===currentMonth?'active':''}" onclick="switchMonth('${m}')">${half.labels[m]}</button>`
  ).join('');
  updateExcelLink();
}

function switchMonth(m){
  currentMonth = m;
  REPORT = ALL_DATA[currentHalf].reports[m];
  currentStoreIndex = 0;
  renderMonthTabs();
  renderAll();
}

function renderAll(){
  const wrap = document.getElementById('dashboardBody');
  const noData = document.getElementById('noDataMsg');
  if(!REPORT){
    wrap.style.display = 'none';
    noData.style.display = 'block';
    return;
  }
  wrap.style.display = '';
  noData.style.display = 'none';
  renderStoreSummaryGrid();
  renderGauges(REPORT.stores[0].name);
  renderMatrix(0);
  renderProductSummary();
  renderProductRanking();
}

    card.style.cursor = 'pointer';
    let bars = '';
    REPORT.products.forEach(p => {
      const info = store.products[p];
      const pct = info.target ? Math.round(info.total/info.target*100) : 0;
      bars += `<div class="pbar-col">
        <div class="pbar-pct">${pct}%</div>

  document.getElementById('bigChartModalTitle').textContent = `${store.name}店 進捗サマリー`;
  document.getElementById('bigChartModalSub').textContent =
    `達成 ${store.achieved.length}/10商品 ー 達成率合計 ${store.pct_sum}/1000(バーをクリックで担当CA別の内訳を表示)`;
  document.getElementById('bigChartModalBody').innerHTML = `<div class="product-chart-lg">${bars}</div>`;
  document.getElementById('bigChartModal').style.display = 'flex';
}

function openCaGroupDetail(storeIdx, pi){
  setModalMode('chart');
  const store = REPORT.stores[storeIdx];
  const p = REPORT.products[pi];
  const info = store.products[p];
  const cas = store.cas;
  const values = cas.map(ca => info.by_ca[ca].qty);
  const maxVal = Math.max(1, ...values);
  let bars = '';
  cas.forEach((ca, ci) => {
    const qty = info.by_ca[ca].qty;
    const heightPct = Math.round((qty/maxVal)*100);
    bars += `<div class="pbar-col-lg" style="cursor:pointer;" onclick="closeBigChartModal();openDetail(${storeIdx},${pi},${ci})">
      <div class="pbar-pct-lg">${qty}</div>
      <div class="pbar-track-lg"><div class="pbar-fill" style="background:var(--qty);height:${heightPct}%"></div></div>
      <div class="pbar-label-lg">${ca}</div>
    </div>`;
  });
  const targetTxt = info.target!=null ? `目標${info.target} / ` : '';
  document.getElementById('bigChartModalTitle').textContent = `${store.name}店 ー ${p}`;
  document.getElementById('bigChartModalSub').textContent = `${targetTxt}計 ${info.total}${unitFor(p)}(バーをクリックで実績明細を表示)`;
  document.getElementById('bigChartModalBody').innerHTML = `<div class="product-chart-lg">${bars}</div>`;
  document.getElementById('bigChartModal').style.display = 'flex';
}
function closeBigChartModal(){ document.getElementById('bigChartModal').style.display = 'none'; }

function vName(name){ return name.replace(/[\s\u3000]/g,'').split('').join('<br>'); }
function shortLabel(name){
  const surname = name.split(/[\s\u3000]+/)[0];
  return vName(surname.slice(0,3));
}

function renderGauges(selectedName){
  const row = document.getElementById('gaugeRow');
  row.innerHTML = '';
  REPORT.stores.forEach((store, idx) => {
    const card = document.createElement('div');
    card.className = 'gauge-card' + (store.name===selectedName ? ' selected':'');
    if(store.has_target){
      const r=36, c=2*Math.PI*r;
      const overallPct = Math.round(store.pct_sum/10);
      const dash = c*Math.min(overallPct/100,1);
      const color = overallPct>=100 ? 'var(--green)' : overallPct>=80 ? 'var(--amber)' : 'var(--red)';
      const chips = store.achieved.map(p=>`<span class="chip">${p}</span>`).join('');
      card.innerHTML = `
        <div class="store-name">${store.name}</div>
        <svg viewBox="0 0 84 84">
          <circle cx="42" cy="42" r="${r}" fill="none" stroke="#2a313d" stroke-width="7"/>
          <circle cx="42" cy="42" r="${r}" fill="none" stroke="${color}" stroke-width="7"
            stroke-dasharray="${dash} ${c}" stroke-linecap="round" transform="rotate(-90 42 42)"/>
          <text x="42" y="40" text-anchor="middle" fill="${color}" font-family="Roboto Mono" font-size="16" font-weight="700">${store.pct_sum}</text>
          <text x="42" y="55" text-anchor="middle" fill="var(--text-dim)" font-family="Roboto Mono" font-size="8">/1000</text>
        </svg>
        <div class="achieved-line">達成 ${store.achieved.length}/10商品</div>
        <div class="chips">${chips}</div>`;
    } else {
      const rows = store.no_target_breakdown && store.no_target_breakdown.length
        ? store.no_target_breakdown.map(b=>`<div class="noTargetRow"><span class="pname">${b.product}</span><span class="pqty">${b.qty}</span></div>`).join('')
        : `<div class="noTargetEmpty">実績なし</div>`;
      card.innerHTML = `
        <div class="store-name">${store.name}</div>
        <div class="noTargetList">${rows}</div>`;
    }
    card.onclick = () => { renderGauges(store.name); renderMatrix(idx); };
    row.appendChild(card);
  });
}

function renderMatrix(storeIdx){
  currentStoreIndex = storeIdx;
  const store = REPORT.stores[storeIdx];
  document.getElementById('storeTag').textContent = store.name;
  const chart = document.getElementById('caChart');
  let html = '';
  REPORT.products.forEach((p, pi) => {
    const info = store.products[p];
    const cas = store.cas;
    const values = cas.map(ca => info.by_ca[ca].qty);
    const maxVal = Math.max(1, ...values);
    let bars = '';
    cas.forEach((ca, ci) => {
      const qty = info.by_ca[ca].qty;
      const heightPct = Math.round((qty/maxVal)*100);
      bars += `<div class="ca-bar-col" onclick="event.stopPropagation();openDetail(${storeIdx},${pi},${ci})">
        <div class="ca-bar-pct">${qty}</div>
        <div class="ca-bar-track"><div class="ca-bar-fill" style="height:${heightPct}%"></div></div>
        <div class="ca-name">${shortLabel(ca)}</div>
      </div>`;
    });
    const targetTxt = info.target!=null ? `目標${info.target} / ` : '';
    html += `<div class="ca-group" onclick="openCaGroupDetail(${storeIdx},${pi})">
      <div class="ca-bars">${bars}</div>
      <div class="ca-group-label">${p}</div>
      <div class="ca-group-target">${targetTxt}計 ${info.total}個</div>
    </div>`;
  });
  chart.innerHTML = html;
}

function openDetail(storeIdx, pi, ci){
  const store = REPORT.stores[storeIdx];
  const p = REPORT.products[pi];
  const ca = store.cas[ci];
  const info = store.products[p].by_ca[ca];

  if(ca === 'その他'){
    document.getElementById('modalTitle').textContent = `その他(${store.name}) の内訳`;
    document.getElementById('modalSub').textContent = `${p} ー 実績 ${info.qty}件(他店舗所属の応援CA・担当不明分)`;
    const rowsHtml = info.records.length
      ? info.records.map(r=>`<tr><td>${r.ca}</td><td>${r.date}</td><td>${r.customer}</td><td>${r.order_no}</td></tr>`).join('')
      : `<tr><td colspan="4" style="text-align:center;color:var(--text-dim);">実績なし</td></tr>`;
    document.getElementById('modalBody').innerHTML = `
      <table class="detail-table">
        <thead><tr><th>担当者</th><th>売上日</th><th>お客様名</th><th>オーダーNO</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>`;
    document.getElementById('detailModal').style.display = 'flex';
    return;
  }

  document.getElementById('modalTitle').textContent = `${ca}(${store.name}) の販売実績`;
  document.getElementById('modalSub').textContent = `${p} ー 実績 ${info.qty}件`;
  const rowsHtml = info.records.length
    ? info.records.map(r=>`<tr><td>${r.date}</td><td>${r.customer}</td><td>${r.plate}</td><td>${r.order_no}</td></tr>`).join('')
    : `<tr><td colspan="4" style="text-align:center;color:var(--text-dim);">実績なし</td></tr>`;
  document.getElementById('modalBody').innerHTML = `
    <table class="detail-table">
      <thead><tr><th>売上日</th><th>お客様名</th><th>登録番号</th><th>オーダーNO</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>`;
  document.getElementById('detailModal').style.display = 'flex';
}
function closeDetail(){ document.getElementById('detailModal').style.display = 'none'; }

function renderProductSummary(){
  const grid = document.getElementById('productGrid');
  grid.innerHTML = '';
  const targetStores = REPORT.stores.filter(s=>s.has_target);
  REPORT.products.forEach(p => {
    const card = document.createElement('div');
    card.className = 'product-card';
    card.style.cursor = 'pointer';
    let bars = '';
    targetStores.forEach(store => {
      const info = store.products[p];
      const pct = info.target ? Math.round(info.total/info.target*100) : 0;
      bars += `<div class="pbar-col">
        <div class="pbar-pct">${pct}%</div>
        <div class="pbar-track"><div class="pbar-fill ${pctClass(pct)}" style="height:${Math.min(pct,100)}%"></div></div>
        <div class="pbar-label">${store.name}</div>
        <div class="pbar-fig">${info.total}/${info.target}</div>
      </div>`;
    });
    card.innerHTML = `<div class="pname">${p}</div><div class="product-chart">${bars}</div>`;
    card.onclick = () => openProductSummaryDetail(p);
    grid.appendChild(card);
  });
}

function openProductSummaryDetail(p){
  _lastProductForSummary = p;
  setModalMode('chart');
  const targetStores = REPORT.stores.filter(s=>s.has_target);
  let totalActual = 0, totalTarget = 0;
  let bars = '';
  targetStores.forEach(store => {
    const info = store.products[p];
    const pct = info.target ? Math.round(info.total/info.target*100) : 0;
    totalActual += info.total; totalTarget += (info.target || 0);
    bars += `<div class="pbar-col-lg" onclick="openProductStoreDetail('${store.name}','${p.replace(/'/g,"\'")}','product')">
      <div class="pbar-pct-lg">${pct}%</div>
      <div class="pbar-track-lg"><div class="pbar-fill ${pctClass(pct)}" style="height:${Math.min(pct,100)}%"></div></div>
      <div class="pbar-label-lg">${store.name}</div>
      <div class="pbar-fig-lg">${info.total} / ${info.target}</div>
    </div>`;
  });
  document.getElementById('bigChartModalTitle').textContent = `${p} ー 店舗別サマリー`;
  document.getElementById('bigChartModalSub').textContent = `対象6店舗合計 ${totalActual} / ${totalTarget}(バーをクリックで担当CA別の内訳を表示)`;
  document.getElementById('bigChartModalBody').innerHTML = `<div class="product-chart-lg">${bars}</div>`;
  document.getElementById('bigChartModal').style.display = 'flex';
}

let _lastProductForSummary = null;

function openProductStoreDetail(storeName, p, origin){
  setModalMode('list');
  const store = REPORT.stores.find(s => s.name === storeName);
  if(!store) return;
  const info = store.products[p];
  const unit = unitFor(p);
  const entries = store.cas.map(ca => ({ca, qty: info.by_ca[ca].qty}))
    .filter(e => e.qty > 0)
    .sort((a,b) => b.qty - a.qty);
  const rows = entries.length ? entries.map((e,i)=>{
    const badge = i<3 ? `<div class="rank-badge rank-badge-lg rank-${i+1}">${i+1}</div>` : `<div class="rank-plain rank-plain-lg">${i+1}</div>`;
    return `<div class="rank-row rank-row-lg">${badge}<div class="rname rname-lg">${e.ca}</div><div class="rqty rqty-lg">${e.qty}${unit}</div></div>`;
  }).join('') : `<div style="color:var(--text-dim);font-size:14px;padding:12px 0;">実績なし</div>`;
  const backHtml = origin === 'store'
    ? `<a href="javascript:void(0)" onclick="goBackToStoreSummary()">← ${store.name}店 進捗サマリーに戻る</a>`
    : `<a href="javascript:void(0)" onclick="goBackToProductSummary()">← 店舗別サマリーに戻る</a>`;
  document.getElementById('bigChartModalTitle').textContent = `${store.name}店 ー ${p}`;
  document.getElementById('bigChartModalSub').innerHTML = backHtml;
  document.getElementById('bigChartModalBody').innerHTML = `<div class="rank-list-lg">${rows}</div>`;
  document.getElementById('bigChartModal').style.display = 'flex';
}

function goBackToProductSummary(){
  if(_lastProductForSummary) openProductSummaryDetail(_lastProductForSummary);
}

function goBackToStoreSummary(){
  if(_lastStoreForSummary) openStoreSummaryDetail(_lastStoreForSummary);
}

function renderProductRanking(){
  const grid = document.getElementById('rankingGrid');
  grid.innerHTML = '';
  REPORT.products.forEach(p => {
    const top5 = REPORT.ranking[p];
    const unit = unitFor(p);
    const card = document.createElement('div');
    card.className = 'product-card';
    card.style.cursor = 'pointer';
    let rows = top5.length ? top5.map((e,i)=>{
      const badge = i<3 ? `<div class="rank-badge rank-${i+1}">${i+1}</div>` : `<div class="rank-plain">${i+1}</div>`;
      return `<div class="rank-row">${badge}<div class="rname">${e.ca}<span class="rstore">(${e.store})</span></div><div class="rqty">${e.qty}${unit}</div></div>`;
    }).join('') : `<div style="color:var(--text-dim);font-size:12px;padding:6px 0;">実績なし</div>`;
    card.innerHTML = `<div class="pname">${p}</div>${rows}`;
    card.onclick = () => openProductRankingDetail(p);
    grid.appendChild(card);
  });
}

function openProductRankingDetail(p){
  setModalMode('list');
  const top5 = REPORT.ranking[p];
  const unit = unitFor(p);
  const rows = top5.length ? top5.map((e,i)=>{
    const badge = i<3 ? `<div class="rank-badge rank-badge-lg rank-${i+1}">${i+1}</div>` : `<div class="rank-plain rank-plain-lg">${i+1}</div>`;
    return `<div class="rank-row rank-row-lg">${badge}<div class="rname rname-lg">${e.ca}<span class="rstore rstore-lg">(${e.store})</span></div><div class="rqty rqty-lg">${e.qty}${unit}</div></div>`;
  }).join('') : `<div style="color:var(--text-dim);font-size:14px;padding:12px 0;">実績なし</div>`;
  document.getElementById('bigChartModalTitle').textContent = `${p} ー CA販売ランキング`;
  document.getElementById('bigChartModalSub').textContent = `対象6店舗 上位${top5.length}名`;
  document.getElementById('bigChartModalBody').innerHTML = `<div class="rank-list-lg">${rows}</div>`;
  document.getElementById('bigChartModal').style.display = 'flex';
}

renderHalfTabs();
renderMonthTabs();
renderAll();
</script>
